name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: write   # needed to publish the Release

env:
  LLAMA_REF: master      # llama.cpp branch or tag to build
  CACHE_VERSION: v1      # bump this (v2, v3...) to force a fresh llama.cpp rebuild
  MONACO_VERSION: 0.52.2

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached llama-server
        id: lc
        uses: actions/cache@v4
        with:
          path: build/bin/llama-server
          key: llama-server-${{ env.CACHE_VERSION }}-${{ env.LLAMA_REF }}

      - name: Fetch llama.cpp
        if: steps.lc.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with: { repository: ggml-org/llama.cpp, ref: "${{ env.LLAMA_REF }}", path: llama.cpp, fetch-depth: 1 }

      - name: Build llama-server for arm64
        if: steps.lc.outputs.cache-hit != 'true'
        run: |
          cmake -B build -S llama.cpp \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DCMAKE_C_FLAGS=-march=armv8.2-a+dotprod -DCMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod
          cmake --build build --target llama-server -j4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Bundle Monaco Editor Offline
        run: |
          mkdir -p www/vs
          curl -fsSL "https://registry.npmjs.org/monaco-editor/-/monaco-editor-${{ env.MONACO_VERSION }}.tgz" \
            | tar -xz --strip-components=3 -C www/vs package/min/vs
          # sanity: loader.js must exist
          test -f www/vs/loader.js

      - name: Package into app
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/assets/www
          cp build/bin/llama-server android/app/src/main/jniLibs/arm64-v8a/libllama_server.so
          # Full offline tree: index.html + vs/ (Monaco)
          cp www/index.html android/app/src/main/assets/www/index.html
          cp -a www/vs android/app/src/main/assets/www/vs
          # Offline PDF libs (pdf.js + pdf-lib)
          if [ -d www/vendor ]; then cp -a www/vendor android/app/src/main/assets/www/vendor; fi
          # Keep a flat fallback for older packaging paths
          cp www/index.html android/app/src/main/assets/index.html

      - run: gradle -p android assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk local-chat.apk

      - uses: actions/upload-artifact@v4
        with: { name: local-chat-apk, path: local-chat.apk }

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" local-chat.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
