<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Kojot</title>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[data-theme=light]{--bg:#fff;--bg-sidebar:#f9f9f9;--bg-elevated:#fff;--bg-composer:#fff;--bg-bubble:#f0f0f0;--bg-subtle:#f4f4f4;--bg-hover:rgba(13,13,13,.05);--bg-well:rgba(13,13,13,.05);--fg:#0d0d0d;--fg-2:#5d5d5d;--fg-3:#6d6d6d;--line:rgba(13,13,13,.10);--line-strong:rgba(13,13,13,.16);--scrim:rgba(13,13,13,.40);--accent:#0d0d0d;--on-accent:#fff;--link:#2563eb;--danger:#dc2626;--success:#16a34a;--sh-composer:0 2px 8px rgba(13,13,13,.05),0 4px 24px rgba(13,13,13,.14);--sh-sheet:0 -8px 40px rgba(13,13,13,.14);--sh-pop:0 12px 40px rgba(13,13,13,.16);--shim-a:#3b4453;--shim-b:#8b94a3;color-scheme:light}
[data-theme=dark]{--bg:#202020;--bg-sidebar:#171717;--bg-elevated:#2f2f2f;--bg-composer:#303030;--bg-bubble:#323232;--bg-subtle:#2a2a2a;--bg-hover:rgba(255,255,255,.06);--bg-well:rgba(255,255,255,.06);--fg:#ececec;--fg-2:#b4b4b4;--fg-3:#8e8e8e;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.16);--scrim:rgba(0,0,0,.60);--accent:#fff;--on-accent:#0d0d0d;--link:#7ab0ff;--danger:#f87171;--success:#4ade80;--sh-composer:0 0 0 1px rgba(255,255,255,.04),0 0 28px rgba(255,255,255,.08),0 4px 20px rgba(0,0,0,.18);--sh-sheet:0 -8px 40px rgba(0,0,0,.5);--sh-pop:0 12px 40px rgba(0,0,0,.5);--shim-a:#8e8e8e;--shim-b:#f2f2f2;color-scheme:dark}
@keyframes shimmer{0%{background-position:130% 0}to{background-position:-30% 0}}
@keyframes dots{0%,to{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,to{opacity:1}50%{opacity:.35}}
@keyframes spark{0%,to{opacity:.55;transform:scale(.92) rotate(0)}50%{opacity:1;transform:scale(1.08) rotate(60deg)}}
@keyframes dock{0%{opacity:.6;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/24px var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;height:100dvh;overflow:hidden}
/* sidebar drawer */
.sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;width:min(300px,85vw);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));background:var(--bg-sidebar);border-inline-end:1px solid var(--line);transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s;box-shadow:0 0 24px rgba(0,0,0,.2)}
.sidebar.open{transform:none;visibility:visible;transition:transform .2s ease}
.scrim{position:fixed;inset:0;z-index:59;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sb-head{display:flex;align-items:center;justify-content:space-between;height:44px;padding-inline:8px 0}
.brand{font-size:17px;font-weight:600;letter-spacing:-.3px}.brand small{font-size:13px;font-weight:500;color:var(--fg-2);margin-inline-start:2px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:var(--fg-2);transition:background .15s var(--ease),color .15s}
.ib:hover,.ib:active{background:var(--bg-hover);color:var(--fg)}.ib svg{width:20px;height:20px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border-radius:10px;font-size:14px;text-align:start;white-space:nowrap;transition:background .15s var(--ease)}
.row:hover,.row:active{background:var(--bg-hover)}.row.sel{background:var(--bg-well)}.row svg{width:18px;height:18px;flex:none}
.label{margin:16px 10px 6px;font-size:12px;font-weight:500;color:var(--fg-3)}
.hist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.hist .row span{flex:1;overflow:hidden;text-overflow:ellipsis}.hist .del{opacity:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--fg-3)}
.hist .row:hover .del,.hist .row.sel .del{opacity:1}.del:hover{background:var(--bg-hover);color:var(--danger)}
.sb-card{margin-top:8px;padding:14px 10px 6px;border-top:1px solid var(--line);font-size:13px;line-height:18px;color:var(--fg-2)}
.sb-card b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{flex:none;display:flex;align-items:center;gap:4px;min-height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0}
.pill{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:0 6px;font-size:17px;font-weight:500}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--fg-3);flex:none}
.pill i.ok{background:var(--success)}.pill i.bad{background:var(--danger)}.pill i.wait{animation:pulse 1.4s ease infinite}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill em{font-style:normal;font-size:13px;color:var(--fg-2);font-weight:400}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.thread{display:flex;flex-direction:column;gap:20px;max-width:768px;margin:0 auto;padding:12px 16px 24px}
.turn{animation:rise .25s var(--ease)}
.turn.u{align-self:flex-end;max-width:min(279px,78%);padding:10px 16px;border-radius:20px;background:var(--bg-bubble);white-space:pre-wrap;overflow-wrap:anywhere}
.turn.a{align-self:stretch;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}.md p{margin:0 0 12px}
.md h1,.md h2,.md h3{margin:18px 0 8px;font-weight:500;line-height:1.3}.md h1{font-size:1.25em}.md h2{font-size:1.15em}.md h3{font-size:1.05em}
.md ul,.md ol{margin:0 0 12px;padding-inline-start:22px}.md li{margin:2px 0}
.md a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.md blockquote{margin:0 0 12px;padding:2px 0 2px 12px;border-inline-start:2px solid var(--line-strong);color:var(--fg-2)}
.md code{font:14px/20px var(--mono);padding:0 5px;border-radius:4px;background:var(--bg-subtle)}
.code{margin:0 0 12px;border-radius:16px;background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.code-h{display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 8px 0 16px;font-size:12px;color:var(--fg-2);border-bottom:1px solid var(--line)}
.code-h button{height:26px;padding:0 10px;border-radius:999px;font-size:12px;color:var(--fg-2)}.code-h button:hover{background:var(--bg-hover);color:var(--fg)}
.code pre{margin:0;padding:12px 16px;overflow-x:auto}.code code{padding:0;background:none;font:14px/21px var(--mono);white-space:pre}
.acts{display:flex;gap:2px;margin-top:6px;margin-inline-start:-8px}.acts .ib{width:32px;height:32px;border-radius:8px}.acts svg{width:16px;height:16px}
.think{display:inline-flex;align-items:center;gap:10px;color:transparent;background:linear-gradient(100deg,var(--shim-a) 35%,var(--shim-b) 50%,var(--shim-a) 65%) 130% 0/300% 100%;-webkit-background-clip:text;background-clip:text;animation:shimmer 1.6s linear infinite;font-size:15px}
.think svg{width:18px;height:18px;color:var(--fg-2);animation:spark 1.6s ease infinite}
.dots span{animation:dots 1s ease infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.notice{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:20px}
.notice b{color:var(--danger);font-weight:500}.notice button{align-self:flex-start;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:500}
/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding:10vh 16px 0}
.hero svg{width:40px;height:40px}.hero h1{margin:0;font-size:26px;line-height:32px;font-weight:500;letter-spacing:-.3px}
.hero p{margin:-10px 0 0;font-size:15px;color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px;margin-top:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;transition:background .15s var(--ease),border-color .15s}
.chip:hover,.chip:active{background:var(--bg-hover);border-color:var(--line-strong)}
/* composer */
.dock{flex:none;padding:6px 12px calc(8px + env(safe-area-inset-bottom));animation:dock .4s var(--ease)}
.comp{max-width:768px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;padding:8px;border-radius:26px;border:1px solid transparent;background:var(--bg-composer);box-shadow:var(--sh-composer);transition:box-shadow .2s}
[data-theme=light] .comp{border-color:var(--line-strong)}
.comp textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:none;color:var(--fg);font:16px/24px var(--font);padding:8px 4px 8px 10px;max-height:168px}
.comp textarea::placeholder{color:var(--fg-2)}
.send{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);transition:opacity .15s,transform .15s var(--ease)}
.send:active{transform:scale(.92)}.send:disabled{background:var(--bg-well);color:var(--fg-3);cursor:default}.send svg{width:18px;height:18px;stroke-width:2.2}
.foot{text-align:center;font-size:11px;line-height:15px;color:var(--fg-3);padding-top:6px}
/* sheet */
.ss{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.ss.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;padding:8px 20px calc(20px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--bg-elevated);box-shadow:var(--sh-sheet);transform:translateY(24px);transition:transform .3s var(--ease)}
.ss.open .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 12px}
.sheet h2{margin:0 0 14px;font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.2px}
.f{display:block;margin-bottom:14px;font-size:13px;color:var(--fg-2)}
.f input[type=text],.f textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-well);color:var(--fg);font:16px/24px var(--font);outline:0}
.f input:focus,.f textarea:focus{border-color:var(--link)}.f textarea{min-height:84px;resize:vertical}
.f input[type=range]{width:100%;margin-top:8px;accent-color:var(--accent)}.f b{float:right;color:var(--fg);font-weight:500}
.tabs{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--bg-well);margin-top:6px}
.tabs button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg-2)}.tabs button.on{background:var(--bg-hover);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;font-weight:500}.btn.p{background:var(--accent);color:var(--on-accent);border-color:transparent}
.test{font-size:13px;margin:-6px 0 14px;min-height:18px}
@media(min-width:1024px){.sidebar{position:static;transform:none;visibility:visible;box-shadow:none;flex:0 0 260px}.scrim{display:none}.mb{display:none}}
/* ===== tool cards ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{transform:translateX(-110%)}to{transform:translateX(280%)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes shake{0%,to{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes askglow{0%,to{box-shadow:inset 0 0 0 1px var(--line-strong)}50%{box-shadow:inset 0 0 0 1px var(--fg-3),0 0 18px rgba(127,127,127,.18)}}
@keyframes flash{0%{background:var(--bg-hover)}to{background:var(--bg-subtle)}}
.calls{display:flex;flex-direction:column;gap:8px;margin-top:10px}.calls:empty{display:none}.md:empty{display:none}
.batch{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 8px 6px 14px;border-radius:16px;background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--fg-2)}
.batch b{color:var(--fg);font-weight:500}.batch .sp{flex:1}
.batch button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line-strong)}
.batch button.go,.tc-a .go{background:var(--accent);color:var(--on-accent);border-color:transparent}
.tc{position:relative;overflow:hidden;border-radius:16px;background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s var(--ease),opacity .3s}
.tc.ent{animation:rise .35s var(--ease)}
.tc.ask{animation:askglow 2.2s ease infinite}.tc.denied,.tc.skip{opacity:.62}
.tc.err.fx{animation:shake .4s}.tc.ok.fx{animation:flash .8s ease}
.tc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 12px;text-align:start}
.tc-i{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bg-well);color:var(--fg-2);transition:background .3s,color .3s}
.tc-i svg{width:17px;height:17px}
.tc.run .tc-i,.tc.prep .tc-i{background:var(--bg-hover);color:var(--fg)}.tc.ok .tc-i{color:var(--success)}.tc.err .tc-i{color:var(--danger)}
.tc.ok.fx .tc-i{animation:pop .45s var(--ease)}
.tc-t{flex:1;min-width:0}
.tc-t b{display:block;font-size:14px;line-height:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-t small{display:block;font:12px/17px var(--mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.run .tc-t b,.tc.prep .tc-t b{color:transparent;background:linear-gradient(100deg,var(--shim-a) 35%,var(--shim-b) 50%,var(--shim-a) 65%) 130% 0/300% 100%;-webkit-background-clip:text;background-clip:text;animation:shimmer 1.6s linear infinite}
.tc.run::after,.tc.prep::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:36%;background:linear-gradient(90deg,transparent,var(--fg-2),transparent);animation:sweep 1.5s var(--ease) infinite}
.tc-s{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--fg-3)}.tc-s svg{width:18px;height:18px}
.tc.ok .tc-s{color:var(--success)}.tc.err .tc-s{color:var(--danger)}
.ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--fg);animation:spin .8s linear infinite}
.dotq{width:7px;height:7px;border-radius:50%;background:var(--fg-3);opacity:.5}
.ck path{stroke-dasharray:24;stroke-dashoffset:0}.fx .ck path{stroke-dashoffset:24;animation:draw .45s .08s var(--ease) forwards}
.chev{flex:none;width:18px;height:18px;color:var(--fg-3);transition:transform .25s var(--ease)}.tc.open .chev{transform:rotate(180deg)}
.tc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}.tc.open .tc-b,.tc.ask .tc-b{grid-template-rows:1fr}
.tc-b>div{overflow:hidden;min-height:0}.tc-in{padding:2px 12px 12px;font-size:13px;line-height:19px;color:var(--fg-2)}
.tc-a{display:flex;gap:8px;padding:0 12px 12px}
.tc-a button{flex:1;height:40px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--line-strong);transition:transform .15s var(--ease)}.tc-a button:active{transform:scale(.97)}
.tc.dng .tc-a .go{background:var(--danger);color:#fff}
.pr{display:grid;grid-template-columns:34px 1fr;gap:1px 8px;margin-bottom:8px;font:12px/17px var(--mono)}
.pr em{font-style:normal;color:var(--fg-3)}.pr span{overflow-wrap:anywhere;color:var(--fg)}.pr .bad{color:var(--danger)}
.ln{display:flex;align-items:center;gap:8px;min-height:24px;font:12px/17px var(--mono);overflow-wrap:anywhere}.ln svg{width:14px;height:14px;flex:none;color:var(--fg-3)}.ln i{margin-inline-start:auto;font-style:normal;color:var(--fg-3);padding-inline-start:8px;white-space:nowrap}
.lst{max-height:210px;overflow-y:auto;overscroll-behavior:contain}
.sr{display:flex;gap:10px;padding:6px 0;color:inherit;text-decoration:none}.sr+.sr{border-top:1px solid var(--line)}
.sr s{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg-well);display:grid;place-items:center;font:500 12px var(--font);text-decoration:none;color:var(--fg)}
.sr div{min-width:0}.sr b{display:block;font-size:13px;line-height:18px;font-weight:500;color:var(--fg)}.sr small{display:block;font-size:12px;line-height:16px;color:var(--fg-3)}
.sr p{margin:2px 0 0;font-size:12px;line-height:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ans{margin:0 0 8px;padding:8px 10px;border-radius:12px;background:var(--bg-well);color:var(--fg)}
.tc pre{margin:0;padding:8px 10px;max-height:180px;overflow:auto;border-radius:12px;background:var(--bg-well);font:12px/17px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.diffView{font-family:var(--mono);font-size:12px;line-height:1.45;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:280px;background:var(--bg-well);margin-top:6px}
.diff-eq{padding:1px 10px;color:var(--fg-3);white-space:pre-wrap}
.diff-del{padding:1px 10px;background:rgba(255,80,80,.14);color:#ff8a8a;white-space:pre-wrap}
.diff-add{padding:1px 10px;background:rgba(62,207,142,.14);color:#6eebb0;white-space:pre-wrap}
.acts .ib[data-dl]{font-size:11px;font-weight:600;width:auto;padding:0 8px;letter-spacing:.02em}
.warn,.note{margin-top:6px;font-size:12px;line-height:17px}.warn{color:var(--danger)}.note{color:var(--fg-3)}
/* thoughts */
.tho{margin-bottom:10px}.tho-b{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;border-radius:999px;font-size:13px;color:var(--fg-2);background:var(--bg-well)}
.tho-b svg{width:14px;height:14px}.tho-b svg:last-child{transition:transform .25s var(--ease)}.tho.open .tho-b svg:last-child{transform:rotate(180deg)}
.tho-t{display:none;margin-top:8px;padding:2px 0 2px 12px;border-inline-start:2px solid var(--line-strong);font-size:14px;line-height:21px;color:var(--fg-3);white-space:pre-wrap;max-height:240px;overflow:auto}.tho.open .tho-t{display:block;animation:rise .25s var(--ease)}
/* ===== settings (compact, scrolling) ===== */
.sheet.s2{display:flex;flex-direction:column;height:min(80dvh,680px);padding:0;overflow:hidden}
.sh-top{flex:none;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 8px 0 18px}.sh-top h2{margin:0;font-size:18px;line-height:24px}
.sh-tabs{flex:none;display:flex;gap:6px;padding:2px 16px 10px;overflow-x:auto;scrollbar-width:none}.sh-tabs::-webkit-scrollbar{display:none}
.sh-tabs button{flex:none;height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg-2);transition:background .2s,color .2s}
.sh-tabs button.on{background:var(--bg-hover);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}.sh-tabs button.nw{animation:rise .3s var(--ease)}
.sh-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 8px}

/* ===== Code Editor view (Monaco Mobile) ===== */
:root{--cyan:#5eead4;--gold:#e5b567;--ember:#f43f5e;--violet:#a78bfa}
#editor-view{display:none;flex-direction:column;position:absolute;inset:0;background:var(--bg);z-index:5}
#editor-view.on{display:flex}
#ed-header{height:44px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:var(--bg-sidebar);border-bottom:1px solid var(--line);font-size:12px;color:var(--fg-2);flex-shrink:0}
#ed-header .file-pill{display:flex;align-items:center;gap:6px;color:var(--fg);font-weight:500;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
#ed-dirty{width:6px;height:6px;border-radius:50%;background:var(--gold);display:none}
#ed-dirty.on{display:inline-block}
#ed-container{flex:1;min-height:0;background:#000}
#ed-find{display:none;background:var(--bg-sidebar);border-top:1px solid var(--line);padding:8px 12px;gap:6px;align-items:center}
#ed-find.open{display:flex}
#ed-find input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--fg);font-size:13px;padding:6px 10px;border-radius:6px;outline:none}
#ed-find input:focus{border-color:var(--gold)}
.ed-acc{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg-sidebar);border-top:1px solid var(--line);padding:4px 6px;gap:4px;user-select:none}
.ed-acc::-webkit-scrollbar{display:none}
.ed-key{background:var(--bg-elevated);border:1px solid var(--line);color:var(--fg);min-width:38px;height:38px;border-radius:6px;font-family:var(--mono);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.ed-key:active{background:var(--line);scale:.94}
.ed-thumb{padding-bottom:env(safe-area-inset-bottom);background:var(--bg-sidebar);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;height:calc(54px + env(safe-area-inset-bottom));padding:0 6px;user-select:none;flex-shrink:0}
.ed-tbtn{background:transparent;border:none;color:var(--fg-2);font-size:10.5px;font-weight:600;padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;touch-action:manipulation}
.ed-tbtn:active{color:var(--fg)}
.ed-tbtn.primary{background:var(--gold);color:#000;padding:6px 14px;border-radius:20px;font-size:11px}
.ed-tbtn svg{width:18px;height:18px}
.diff-highlight-in{background-color:rgba(94,234,212,.28);border-radius:2px;transition:background-color 1.4s ease}
#ed-review{display:none;position:fixed;left:10px;right:10px;bottom:calc(62px + env(safe-area-inset-bottom));background:var(--bg-elevated);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.85);z-index:35}
#ed-review.active{display:flex}
#ed-review .rm{display:flex;justify-content:space-between;font-size:11px;font-family:var(--mono)}
#ed-review .ri{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ed-review .ra{display:flex;gap:6px;flex-wrap:wrap}
#ed-review .rb{flex:1;padding:7px 6px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--bg-subtle);color:var(--fg);cursor:pointer;touch-action:manipulation}
#ed-review .rb.confirm{background:var(--cyan);color:#000;border-color:var(--cyan)}
#ed-review .rb.retry{border-color:var(--gold);color:var(--gold)}
#ed-review .rb.abort{border-color:var(--ember);color:var(--ember)}
#ed-ai-sheet{position:fixed;inset:auto 0 0 0;height:85dvh;max-height:85dvh;background:var(--bg-sidebar);border-top:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column;z-index:40;transform:translateY(100%);transition:transform .26s cubic-bezier(.16,1,.3,1);box-shadow:0 -10px 30px rgba(0,0,0,.8)}
#ed-ai-sheet.open{transform:translateY(0)}
#ed-ai-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:30}
#ed-ai-bd.open{display:block}
.ed-drawer-h{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.ed-drawer-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--cyan)}
.ed-step{background:var(--bg-elevated);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.ed-step.active{border-color:var(--cyan)}
.ed-step textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);font-size:13px;padding:8px 10px;border-radius:6px;resize:none;min-height:52px;outline:none;font-family:inherit}
.ed-step textarea:focus{border-color:var(--cyan)}
.ed-run{background:var(--cyan);color:#000;border:none;padding:10px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;width:100%}
#ed-fbrowser{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column}
#ed-fbrowser.open{display:flex}
#ed-fbrowser .fb-h{height:44px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--bg-sidebar)}
#ed-fbrowser .fb-list{flex:1;overflow-y:auto;padding:8px}
#ed-fbrowser .fb-row{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:8px;cursor:pointer;font-size:14px}
#ed-fbrowser .fb-row:active{background:var(--bg-hover)}
#ed-fbrowser .fb-row .meta{margin-left:auto;font-size:11px;color:var(--fg-3)}
#ed-toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#ed-toast .t{background:var(--bg-elevated);border:1px solid var(--line);color:var(--fg);padding:9px 14px;border-radius:10px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:92%;text-align:center}
#ed-toast .t.show{opacity:1;transform:translateY(0)}
#ed-toast .t.err{border-color:var(--ember)}
#ed-toast .t.ok{border-color:var(--cyan)}
.main.hidden-for-ed{visibility:hidden;pointer-events:none}
.row.ed-nav.on{background:var(--bg-hover);color:var(--fg)}


.kojot-logo {
  stroke: none;
  width: 28px;
  height: 28px;
  display: inline-block;
  vertical-align: middle;
  animation: voxel-float 4s ease-in-out infinite;
  shape-rendering: crispEdges;
}
@keyframes voxel-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2.5px); }
}
.hero .kojot-logo { width: 48px; height: 48px; margin-bottom: 8px; }
/* Thinking: confused-canid head tilt, alternating sides, blink + ear flick */
.think .kojot-logo{transform-origin:50% 88%;animation:kj-tilt 12s ease-in-out infinite}
.kojot-logo .kj-eye,.kojot-logo .kj-ear-l,.kojot-logo .kj-ear-r{transform-box:fill-box;transform-origin:center}
.think .kojot-logo .kj-eye{animation:kj-blink 6s ease-in-out infinite}
.think .kojot-logo .kj-ear-l{animation:kj-twl 12s ease-in-out infinite}
.think .kojot-logo .kj-ear-r{animation:kj-twr 12s ease-in-out infinite}
@keyframes kj-tilt{
  0%,100%{transform:rotate(0)}
  6%,30%{transform:rotate(-9deg)}
  38%,50%{transform:rotate(0)}
  56%,80%{transform:rotate(9deg)}
  88%{transform:rotate(0)}
}
@keyframes kj-blink{
  0%,31%,37%,100%{transform:scaleY(1)}
  34%{transform:scaleY(.12)}
}
@keyframes kj-twl{
  0%,21%,29%,100%{transform:translate(0,0)}
  23%,27%{transform:translate(-1.6px,.8px)}
  25%{transform:translate(0,0)}
}
@keyframes kj-twr{
  0%,71%,79%,100%{transform:translate(0,0)}
  73%,77%{transform:translate(1.6px,.8px)}
  75%{transform:translate(0,0)}
}
@media (prefers-reduced-motion:reduce){
  .think .kojot-logo,.think .kojot-logo *{animation:none!important}
}

/* Myers line diff (zero-dep) for edit_file tool cards */
function myersDiff(a,b){
  const A=String(a).split("\n"),B=String(b).split("\n");
  const N=A.length,M=B.length,max=N+M;
  const v={1:0},trace=[];
  for(let d=0;d<=max;d++){
    const v2={};
    for(let k=-d;k<=d;k+=2){
      let x;
      if(k===-d||(k!==d&&(v[k-1]??-1)<(v[k+1]??-1)))x=v[k+1]??0;
      else x=(v[k-1]??0)+1;
      let y=x-k;
      while(x<N&&y<M&&A[x]===B[y]){x++;y++}
      v2[k]=x;
      if(x>=N&&y>=M){
        trace.push(v2);
        const edits=[];
        let x2=N,y2=M;
        for(let d2=trace.length-1;d2>=0;d2--){
          const vPrev=trace[d2],k2=x2-y2;
          const prevK=(k2===-d2||(k2!==d2&&(vPrev[k2-1]??-1)<(vPrev[k2+1]??-1)))?k2+1:k2-1;
          const prevX=vPrev[prevK]??0,prevY=prevX-prevK;
          while(x2>prevX&&y2>prevY){edits.push({t:"eq",line:A[x2-1]});x2--;y2--}
          if(d2===0)break;
          if(x2>prevX){edits.push({t:"del",line:A[x2-1]});x2--}
          else if(y2>prevY){edits.push({t:"add",line:B[y2-1]});y2--}
        }
        return edits.reverse();
      }
    }
    trace.push(v2);Object.assign(v,v2);
  }
  return B.map(line=>({t:"add",line}));
}

function reqParams(){
  const isC = (NI && NI.active_slot === 'coder');
  const p = (isC ? cfg.p_coder : cfg.p) || {}, o = {};
  for(const[k,v] of Object.entries(p)){
    if(v===''||v==null)continue;
    if(k==='stop'){const s=String(v).split('\n').map(x=>x.trim()).filter(Boolean);if(s.length)o.stop=s}
    else if(k==='samplers'){const s=String(v).split(/[;,\s]+/).filter(Boolean);if(s.length)o.samplers=s}
    else if(k==='logit_bias'){try{o.logit_bias=J.parse(v)}catch{}}
    else o[k]=v;
  }
  const rawX = isC ? (cfg.xj_coder || '') : (cfg.xj || '');
  if(rawX){try{Object.assign(o,J.parse(rawX))}catch{}}
  return o;
}
function condenseTool(k) {
  if (k.state === "err") return "[Error: " + String(k.res || "failed").slice(0, 100) + "]";
  if (k.state === "denied" || k.state === "skip") return "[Declined/Skipped]";
  const a = k.args || {};
  if (k.name === "list_dir") return "[Listed " + (a.path || ".") + ": " + (k.data?.total || "items") + " found]";
  if (k.name === "find_files") return "[Found " + (k.data?.total || 0) + " matches for \"" + (a.query || "") + "\"]";
  if (k.name === "read_file") return "[Read " + (a.path || "file") + " (" + String(k.res || "").length + " chars)]";
  if (k.name === "write_file") return "[Wrote " + (a.path || "file") + ": OK]";
  if (k.name === "edit_file") return "[Edited " + (a.path || "file") + ": OK]";
  if (k.name === "move" || k.name === "copy") return "[" + k.name + " OK]";
  if (k.name === "delete") return "[Deleted: OK]";
  if (k.name === "save_fact") return "[Saved fact: OK]";
  if (k.name === "web_search") return "[Web search: " + (k.data?.results?.length || 0) + " results used]";
  if (k.name === "get_vitals") return "[Vitals: " + (k.data?.battery_pct || "?") + "% battery]";
  if (k.name.startsWith("gh_")) return "[GitHub " + k.name + ": OK]";
  return String(k.res || "(done)").slice(0, 120);
}

let _sysMem = null;
function apiMsgs(c) {
  const out = [{ role: "system", content: _sysMem || sysFull() }];
  let lastAsst = null, lastUser = null;
  for (let i = c.messages.length - 1; i >= 0; i--) {
    if (!lastAsst && c.messages[i].role === "assistant") lastAsst = c.messages[i];
    if (!lastUser && c.messages[i].role === "user") lastUser = c.messages[i];
    if (lastAsst && lastUser) break;
  }
  for (const m of c.messages) {
    if (m.role === "user") {
      if (cfg.vision && m.image) {
        if (m === lastUser) {
          out.push({
            role: "user",
            content: [
              { type: "text", text: m.content || "(image)" },
              { type: "image_url", image_url: { url: m.image } }
            ]
          });
        } else {
          out.push({
            role: "user",
            content: (m.content ? m.content + "\n" : "") + "[Attached image: previously analyzed]"
          });
        }
      } else {
        out.push({ role: "user", content: m.content });
      }
    } else if (m.calls && m.calls.length) {
      out.push({
        role: "assistant",
        content: m.content || "",
        tool_calls: m.calls.map(k => ({ id: k.id, type: "function", function: { name: k.name, arguments: JSON.stringify(k.args || {}) } }))
      });
      const isCurrentTurn = (m === lastAsst);
      m.calls.forEach(k => {
        const payload = scrubJunk(isCurrentTurn ? (k.res || "(no result)") : condenseTool(k));
        out.push({ role: "tool", tool_call_id: k.id, content: payload });
      });
    } else if (m.content) {
      out.push({ role: "assistant", content: m.content });
    }
  }
  return out;
}

  fn("gh_commit","Commit a changed file to a feature branch. Automatically creates the branch if it does not exist.",{path:S("File path"),content:S("Full updated file content"),message:S("Commit message"),branch:S("Feature branch name e.g. kojot/fix-bug"),repo:S("owner/repo (optional)")},["path","content","message","branch"]),
  fn("gh_create_pr","Open a Pull Request on GitHub for human review.",{title:S("PR title"),head_branch:S("The feature branch with changes"),body:S("Summary of changes"),base_branch:S("Base branch to merge into (default main)"),repo:S("owner/repo (optional)")},["title","head_branch"])

function b64Dec(str){try{return decodeURIComponent(escape(atob(str.replace(/\s/g,""))))}catch(_){return atob(str.replace(/\s/g,""))}}
function b64Enc(str){try{return btoa(unescape(encodeURIComponent(str)))}catch(_){return btoa(str)}}

async function ghReq(url, method="GET", body=null){
  const token = (cfg.github?.token || "").trim();
  if(!token) throw Error("GitHub Token missing! Add it in Settings -> Tools -> GitHub.");
  const req = {
    url: url.startsWith("http") ? url : "https://api.github.com" + url,
    method,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "User-Agent": "Kojot-Mobile-Agent"
    }
  };
  if(body){
    req.headers["Content-Type"] = "application/json";
    req.body = typeof body === "string" ? body : JSON.stringify(body);
  }
  const r = await httpx(req);
  if(r.status >= 400){
    let msg = r.body;
    try{ msg = JSON.parse(r.body).message || r.body; }catch(_){}
    throw Error(`GitHub API error (${r.status}): ${msg}`);
  }
  try{ return JSON.parse(r.body); }catch(_){ return r.body; }
}

async function ghTool(name, a){
  const defaultRepo = (cfg.github?.repo || "420garbage420/kojot").trim();
  const repo = (a.repo || defaultRepo).trim();

  if(name === "gh_get_issue"){
    const d = await ghReq(`/repos/${repo}/issues/${a.issue_number}`);
    return { text: `Issue #${a.issue_number}: ${d.title}\n\n${d.body || "(No description)"}`, data: { title: d.title, url: d.html_url } };
  }

  if(name === "gh_read_file"){
    const ref = a.ref || "main";
    const d = await ghReq(`/repos/${repo}/contents/${a.path}?ref=${ref}`);
    const code = b64Dec(d.content);
    return { text: code, data: { sha: d.sha, path: d.path, size: d.size } };
  }

  if(name === "gh_commit"){
    const branch = a.branch.replace(/^refs\/heads\//, "");
    let baseSha = null;
    try {
      const bInfo = await ghReq(`/repos/${repo}/git/ref/heads/${branch}`);
      baseSha = bInfo.object.sha;
    } catch(e) {
      const rInfo = await ghReq(`/repos/${repo}`);
      const defBranch = rInfo.default_branch || "main";
      const defInfo = await ghReq(`/repos/${repo}/git/ref/heads/${defBranch}`);
      baseSha = defInfo.object.sha;
      await ghReq(`/repos/${repo}/git/refs`, "POST", { ref: "refs/heads/" + branch, sha: baseSha });
    }

    let fileSha = undefined;
    try {
      const existing = await ghReq(`/repos/${repo}/contents/${a.path}?ref=${branch}`);
      fileSha = existing.sha;
    } catch(_) {}

    const payload = {
      message: a.message,
      content: b64Enc(a.content),
      branch: branch
    };
    if(fileSha) payload.sha = fileSha;

    const res = await ghReq(`/repos/${repo}/contents/${a.path}`, "PUT", payload);
    return {
      text: `Committed ${a.path} to branch ${branch}!\nCommit: ${res.commit?.html_url || "ok"}`,
      data: { branch, commit_url: res.commit?.html_url }
    };
  }

  if(name === "gh_create_pr"){
    const rInfo = await ghReq(`/repos/${repo}`);
    const defBranch = a.base_branch || rInfo.default_branch || "main";
    const res = await ghReq(`/repos/${repo}/pulls`, "POST", {
      title: a.title,
      body: a.body || "Automated PR from Kojot on-device agent.",
      head: a.head_branch,
      base: defBranch
    });
    return {
      text: `Created PR #${res.number}: ${res.title}\nURL: ${res.html_url}`,
      data: { pr: res.number, url: res.html_url }
    };
  }

  throw Error("Unknown gh op: " + name);
}

const FORGE_TOOLS = [
  fn("forge_tool", "Create and install a brand new JavaScript tool for yourself when a requested capability is missing. The user reviews and approves the code before it is added to your toolbelt.", {

    code: S("JavaScript function body. Receives 'args' and environment '{ httpx, nat }'. Must return a string or JSON object."),
    suite: S("Optional category tag e.g. math, web, utility")
  }, ["name", "description", "parameters_json", "code"]),
  fn("list_forged_tools", "List all currently installed custom tools in your forged skill library.", {}, []),
  fn("delete_forged_tool", "Uninstall a custom forged tool if it is obsolete or broken.", { name: S("Name of the tool to remove") }, ["name"])

function forgeCustomTool(a){
  const name = String(a.name || "").trim().toLowerCase().replace(/[^a-z0-9_]/g, "_");
  if(!name) throw Error("Tool name is required (alphanumeric/snake_case).");
  const desc = String(a.description || "").trim();
  if(!desc) throw Error("Tool description is required.");
  let params = { type: "object", properties: {} };
  if(a.parameters_json){
    try { params = typeof a.parameters_json === "object" ? a.parameters_json : JSON.parse(a.parameters_json); }
    catch(e){ throw Error("Invalid parameters_json schema: " + e.message); }
  }
  const code = String(a.code || "").trim();
  if(!code) throw Error("Tool JavaScript code is required.");

  // Pre-flight test compile the JS function
  try {
    const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
    new AsyncFunction("args", "{ httpx, nat }", code);
  } catch(e) {
    throw Error("JavaScript syntax error in tool code: " + e.message);
  }

  customTools = customTools.filter(t => t.name !== name);
  customTools.push({
    name,
    description: desc,
    parameters: params,
    code,
    suite: a.suite || "custom",
    created: Date.now()
  });
  saveCustomTools();
  return {
    text: `Successfully forged and installed tool "${name}"! It is now permanently in your toolbelt.`,
    data: { name, suite: a.suite || "custom" }
  };
}

function deleteCustomTool(a){
  const name = String(a.name || "").trim();
  const prev = customTools.length;
  customTools = customTools.filter(t => t.name !== name);
  saveCustomTools();
  return { text: customTools.length < prev ? `Deleted forged tool "${name}".` : `Tool "${name}" not found.` };
}

function listCustomTools(){
  if(!customTools.length) return { text: "No forged tools installed yet." };
  const list = customTools.map(t => `- ${t.name}: ${t.description} [${t.suite || "custom"}]`).join("\n");
  return { text: `Active forged tools (${customTools.length}):\n${list}`, data: { tools: customTools } };
}

async function execCustomTool(tool, args){
  const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
  const fnExec = new AsyncFunction("args", "{ httpx, nat }", tool.code);
  const out = await fnExec(args, { httpx, nat });
  return {
    text: typeof out === "object" ? JSON.stringify(out, null, 2) : String(out ?? "(done)"),
    data: typeof out === "object" ? out : null
  };
}

async function runTool(k){
  if(k.name==='web_search')return webSearch(k.args.query,k.args.max_results);
  if(k.name.startsWith('gh_'))return ghTool(k.name,k.args);
  if(k.name==='forge_tool')return forgeCustomTool(k.args);
  if(k.name==='list_forged_tools')return listCustomTools();
  if(k.name==='delete_forged_tool')return deleteCustomTool(k.args);
  const ct=(typeof customTools!=="undefined")&&customTools.find(t=>t.name===k.name);
  if(ct)return await execCustomTool(ct,k.args);
  return J.parse(await nat(k.name,k.args));
}
async function execCalls(a){const L=a.calls;
 for(const k of L){if(k.state==='err')continue;k.state=cfg.ask&&ASK.has(k.name)?'ask':'queued';if(k.state==='ask'){let r;const p=new Promise(x=>r=x);gate.set(k.id,{p,r})}}
 refresh(a);
 for(const k of L){
  if(k.state==='err')continue;
  if(k.state==='ask'){const ok=await gate.get(k.id).p;gate.delete(k.id);if(!ok){k.state=stopped?'skip':'denied';k.res=stopped?'Stopped by the user.':'The user declined this action.';refresh(a);continue}}
  if(stopped){k.state='skip';k.res='Stopped by the user.';refresh(a);continue}
  // Continuity pre-flight: block identical failing / looping tool calls
  const g=Continuity.gate(k);
  if(g&&g.block){
    k.state='err';k.res=g.payload;Task.trace(k.name,'err');Continuity.after(k);refresh(a);continue;
  }
  k.state='run';refresh(a);const t0=performance.now();
  try{
    const r=await runTool(k);
    k.res=scrubJunk(String(r.text||'')).slice(0,3500);
    k.data=r.data;k.state='ok';
  }catch(e){k.res=scrubJunk('Error: '+(e.message||e));k.state='err'}
  Continuity.after(k);Task.trace(k.name,k.state);
  const dt=performance.now()-t0;if(dt<380)await sleep(380-dt);k.ms=Math.round(performance.now()-t0);refresh(a)}
 save()}
function stopAll(){stopped=true;if(ctrl)ctrl.abort();gate.forEach(g=>g.r(false))}
async function run(c){setBusy(true);stopped=false;let steps=0;
 try{
  // Inject edge memory + standing task once per user turn
  const lastUser=[...c.messages].reverse().find(m=>m.role==='user');
  const userText=lastUser?lastUser.content:'';
  Task.begin(userText);
  Continuity.begin();
  _sysMem=await sysFullWithMemory(Task.isCont(userText)&&Task.st().goal?Task.st().goal:userText);
  for(;;){const a=c.messages.at(-1);a.error='';a.content=a.content||'';render();
   await turn(c,a);if(stopped){delete a.calls;break}if(a.error||!a.calls||!a.calls.length)break;
   await execCalls(a);if(stopped)break;
   if(++steps>=8){c.messages.push({role:'assistant',content:'I stopped after 8 tool steps. Say "continue" if you want me to keep going.'});break}
   c.messages.push({role:'assistant',content:''});save()}}
 catch(e){const a=c.messages.at(-1);if(a&&a.role==='assistant')a.error=e.message||'Failed'}
 busy=false;ctrl=null;gate.clear();_sysMem=null;const l=c.messages.at(-1);if(l&&l.role==='assistant'&&!l.content&&!l.error&&!(l.calls&&l.calls.length))c.messages.pop();save();setBusy(false);render()}

let curTab='gen', powTarget='chat';
function fillPower(){
  const prefix = powTarget==='coder' ? '_coder' : '';
  const lbl = $('#pow-target-lbl');
  if(lbl) lbl.textContent = powTarget==='coder' ? 'Editing Coder Engine parameters (Qwen)' : 'Editing Chat Engine parameters (Gemma)';
  document.querySelectorAll('#s-body .pane[data-p=pow] [data-k]').forEach(e=>{
    let k = e.dataset.k;
    if(k.startsWith('p.')) k = 'p' + prefix + k.slice(1);
    else if(k.startsWith('srv.')) k = 'srv' + prefix + k.slice(3);
    else if(k === 'xj') k = 'xj' + prefix;
    const v = getPath(cfg, k);
    e.value = v == null ? '' : String(v);
  });
}

function edExtractJson(raw){
  if(!raw||!raw.trim())throw new Error('Empty model response');
  let s=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'').trim();
  try{const p=JSON.parse(s);if(p&&typeof p==='object')return p}catch(_){}
  const m=s.match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0])}catch(_){}
    try{const san=m[0].replace(/"(?:[^"\\]|\\.)*"/g,str=>str.replace(/\r?\n/g,'\\n').replace(/\t/g,'\\t'));return JSON.parse(san)}catch(_){}}
  if(!s.includes('"search"')&&!s.includes('"replace"'))return{search:'',replace:s};
  throw new Error('Could not parse model response as JSON');
}
function edFindSnippet(model,searchStr){
  let exact=[];try{exact=model.findMatches(searchStr,false,false,false,null,true)}catch(_){}
  if(exact.length===1)return exact[0].range;
  if(exact.length>1)throw new Error('Ambiguous match: snippet occurs multiple times');
  const lines=searchStr.replace(/\r\n/g,'\n').split('\n');
  while(lines.length&&!lines[0].trim())lines.shift();
  while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  if(!lines.length)return null;
  const trimmed=lines.map(l=>l.trim());
  const hits=[];
  for(let i=1;i<=model.getLineCount()-trimmed.length+1;i++){
    let ok=true;for(let j=0;j<trimmed.length;j++){if(model.getLineContent(i+j).trim()!==trimmed[j]){ok=false;break}}
    if(ok)hits.push(i);
  }
  if(hits.length===1){const s=hits[0],e=s+trimmed.length-1;return new monaco.Range(s,1,e,model.getLineMaxColumn(e))}
  if(hits.length>1)throw new Error('Ambiguous match: multiple identical blocks');
  return null;
}
function edHighlight(range){if(!ed)return;edDecos=ed.deltaDecorations(edDecos,[{range,options:{inlineClassName:'diff-highlight-in'}}])}
function edClearHL(){if(ed&&edDecos.length)edDecos=ed.deltaDecorations(edDecos,[])}
function edUnlock(fn){const was=ed?ed.getOption(monaco.editor.EditorOption.readOnly):false;if(ed)ed.updateOptions({readOnly:false});try{return fn()}finally{if(ed&&was)ed.updateOptions({readOnly:true})}}

function edCheckSyntax(code, file){
  if(!code || !file) return null;
  const ext = (file.split(".").pop() || "").toLowerCase();
  try {
    if(ext === "json") JSON.parse(code);
    else if(ext === "js" || ext === "mjs") new Function(code);
    else if(ext === "xml" || ext === "html" || ext === "htm") {
      const d = new DOMParser().parseFromString(code, "application/xml");
      const pe = d.querySelector("parsererror");
      if(pe) return (pe.textContent || "XML parse error").split("\n")[0].slice(0, 80);
    }
  } catch(e) {
    return (e.message || "Syntax error").slice(0, 100);
  }
  return null;
}

async function edExecuteStep(heal){
  edClearHL();
  const instruction=edSteps[edIdx];
  $('#ed-rstep').textContent=`STEP ${edIdx+1} / ${edSteps.length}`;
  $('#ed-rinstr').textContent=instruction;
  $('#ed-rstat').textContent=heal?'Self-healing…':'Generating edit…';
  $('#ed-rstat').style.color=heal?'var(--violet)':'var(--gold)';
  $('#ed-g-confirm').disabled=true;$('#ed-g-retry').disabled=true;$('#ed-g-manual').disabled=true;
  $('#ed-review').classList.add('active');edLock(true);
  if(!heal&&edBackup===null)edBackup=ed.getValue();
  if(edBackup===null)edBackup=ed.getValue();
  const sys=`You are a precision code editor. Output ONLY one raw JSON object. Use the SMALLEST possible edit; never re-output the file.
Formats: A) {"search":"<exact existing text 1-5 lines>","replace":"<new text>"} B) {"edits":[{"search":"...","replace":"..."}]}
Rules: 1. search must be EXACT unique copy from buffer. 2. Empty buffer: search "" and full file in replace. 3. No markdown, no prose, no "..." elisions. 4. Prior steps already applied.`;
  const hist=edHist.length?'PRIOR STEPS (already applied):\n'+edHist.join('\n')+'\n\n':'';
  const messages=[{role:'system',content:sys},{role:'user',content:`${hist}INSTRUCTION: ${instruction}\n\nBUFFER:\n${edBackup}`}];
  if(heal){messages.push({role:'assistant',content:String(heal.raw||'').slice(0,800)});messages.push({role:'user',content:`That failed: ${heal.error}\nReturn corrected JSON only.`})}
  let raw='';
  try{
    const base=(cfg.url||'http://127.0.0.1:8080').replace(/\/$/,'');
    const res=await fetch(base+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'local',messages,max_tokens:edBackup.trim()?1200:4096,temperature:0.1})});
    if(!res.ok)throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0,120)}`);
    const data=await res.json();
    if(data.error)throw new Error(typeof data.error==='string'?data.error:(data.error.message||'provider error'));
    raw=data.choices?.[0]?.message?.content||'{}';
    const edit=edExtractJson(raw);
    if(edit.replace===undefined&&!Array.isArray(edit.edits))throw new Error('Invalid edit payload');
    // multi-edit: apply sequentially as single search/replace ops
    const ops=Array.isArray(edit.edits)?edit.edits:[{search:edit.search||'',replace:edit.replace}];
    let work=edBackup.replace(/\r\n/g,'\n');
    for(const op of ops){
      const search=String(op.search||'').replace(/\r\n/g,'\n');
      const replace=String(op.replace??'').replace(/\r\n/g,'\n');
      if(/\/\/\s*\.{3}|\/\*[\s\S]*?\.{3}[\s\S]*?\*\//.test(replace))throw new Error('Lazy code elision not allowed');
      if(!work.trim()){work=replace;continue}
      if(!search)throw new Error('Search cannot be empty on existing buffer');
      if(!work.includes(search)){
        // whitespace-tolerant fallback via model ranges after set
      }
      const i=work.indexOf(search);
      if(i<0)throw new Error(`Snippet not found: "${search.slice(0,24)}…"`);
      if(work.indexOf(search,i+1)>=0)throw new Error('Ambiguous match');
      work=work.slice(0,i)+replace+work.slice(i+search.length);
    }
    const before=ed.getValue();
    edUnlock(()=>ed.executeEdits('ai',[{range:ed.getModel().getFullModelRange(),text:work,forceMoveMarkers:true}]));
    if(ed.getValue()===before&&work!==before)throw new Error('Edit did not modify buffer');
    const syntaxErr = edCheckSyntax(work, edFile);
    if(syntaxErr) throw new Error('Syntax check failed: ' + syntaxErr);
    // highlight first changed region roughly
    const a=edBackup.split('\n'),b=work.split('\n');let s=0;while(s<a.length&&s<b.length&&a[s]===b[s])s++;
    const end=Math.min(Math.max(s+1,1),ed.getModel().getLineCount());
    const range=new monaco.Range(s+1,1,end,ed.getModel().getLineMaxColumn(end));
    ed.revealRangeInCenter(range);edHighlight(range);edBuzz();
    $('#ed-rstat').textContent=heal?'Self-healed (Syntax Clean) ✓':'Applied (Syntax Clean) ✓';
    $('#ed-rstat').style.color='var(--cyan)';
    $('#ed-g-confirm').disabled=false;$('#ed-g-retry').disabled=false;$('#ed-g-manual').disabled=false;
    $('#ed-g-confirm').textContent=edIdx===edSteps.length-1?'Finish Chain':'Confirm & Next';
  }catch(err){
    if(!heal){edExecuteStep({raw,error:err.message});return}
    $('#ed-rstat').textContent=`Failed: ${err.message.slice(0,40)}`;
    $('#ed-rstat').style.color='var(--ember)';
    $('#ed-g-retry').disabled=false;$('#ed-g-manual').disabled=false;
  }
}

$('#ed-start-chain')?.addEventListener('click',()=>{
  edBuzz();
  const active=edSteps.map(s=>s.trim()).filter(Boolean);
  if(!active.length){edToast('Add at least one step','error');return}
  if(!ed){edToast('Open the editor first','error');return}
  edSteps=active;edIdx=0;edChainRunning=true;edBackup=null;edHist=[];edHistN=0;
  $('#ed-ai-sheet').classList.remove('open');$('#ed-ai-bd').classList.remove('open');
  edExecuteStep();
});
$('#ed-g-confirm')?.addEventListener('click',()=>{
  edBuzz();edClearHL();
  edHistN++;edHist.push(`Step ${edHistN}: ${edSteps[edIdx].slice(0,120)} -> [ACCEPTED]`);
  if(edHist.length>6){edHist=[];edHistN=0}
  // persist via native write if we have a real path
  if(edFile&&edFile!=='untitled.html'){
    nat('write_file',{path:edFile,content:ed.getValue(),overwrite:true}).catch(()=>{});
  }
  edBackup=null;edIdx++;
  if(edIdx<edSteps.length)edExecuteStep();
  else{$('#ed-rstat').textContent='All Steps Complete!';setTimeout(()=>{$('#ed-review').classList.remove('active');edChainRunning=false;edLock(false)},1000)}
});
$('#ed-g-retry')?.addEventListener('click',()=>{edBuzz();edClearHL();if(edBackup!==null)edUnlock(()=>ed.setValue(edBackup));edExecuteStep()});
$('#ed-g-manual')?.addEventListener('click',()=>{
  edBuzz();edManual=!edManual;
  if(edManual){$('#ed-g-manual').textContent='Done Editing';edLock(false);ed.focus()}
  else{$('#ed-g-manual').textContent='Manual Edit';edLock(true);edBackup=ed.getValue()}
});
$('#ed-g-abort')?.addEventListener('click',()=>{
  edBuzz();
  if(!confirm('Abort remaining steps? Unconfirmed edit will be discarded.'))return;
  edClearHL();
  if(edBackup!==null)edUnlock(()=>ed.setValue(edBackup));
  $('#ed-review').classList.remove('active');edChainRunning=false;edManual=false;edBackup=null;edLock(false);
  $('#ed-g-manual').textContent='Manual Edit';
});
})();

</script>
</body>
</html>
